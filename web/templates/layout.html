{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
{{if .Concealed}}
<link rel="icon" type="image/svg+xml" href="/core/img/favicon.svg">
{{else}}
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
{{end}}
<link rel="stylesheet" href="/static/app.css">
<script>window.AUTO_REFRESH_SECONDS = {{.AutoRefreshSeconds}};</script>
{{end}}

{{define "topnav"}}
{{if .Concealed}}
<header class="topbar topbar-conceal">
  <a class="brand" href="/admin">
    <span class="conceal-logo-badge"><img src="/static/logo.svg" alt="Netra" style="height:18px;width:auto;"></span>
  </a>
  <nav>
    <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}">Dashboard</a>
    <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}">Links</a>
    <a href="/admin/events" class="{{if eq .Nav "events"}}active{{end}}">Events</a>
    <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}">Settings</a>
  </nav>
  <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false"
    onclick="var n=document.getElementById('mobileNav'); var open=n.hidden; n.hidden=!open; this.setAttribute('aria-expanded', open);">&#9776;</button>
  <form method="post" action="/logout" class="logout-form">
    <button type="submit" class="btn btn-ghost">Log out</button>
  </form>
</header>
<nav id="mobileNav" class="topbar-mobile-nav topbar-conceal" hidden>
  <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}">Dashboard</a>
  <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}">Links</a>
  <a href="/admin/events" class="{{if eq .Nav "events"}}active{{end}}">Events</a>
  <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}">Settings</a>
</nav>
{{else}}
<header class="topbar">
  <a class="brand" href="/admin">
    <img src="/static/logo.svg" alt="Netra" style="height:22px;width:auto;">
    Netra
  </a>
  <nav>
    <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}">Dashboard</a>
    <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}">Links</a>
    <a href="/admin/events" class="{{if eq .Nav "events"}}active{{end}}">Events</a>
    <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}">Settings</a>
  </nav>
  <button type="button" class="nav-toggle" aria-label="Menu" aria-expanded="false"
    onclick="var n=document.getElementById('mobileNav'); var open=n.hidden; n.hidden=!open; this.setAttribute('aria-expanded', open);">&#9776;</button>
  <form method="post" action="/logout" class="logout-form">
    <button type="submit" class="btn btn-ghost">Log out</button>
  </form>
</header>
<nav id="mobileNav" class="topbar-mobile-nav" hidden>
  <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}">Dashboard</a>
  <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}">Links</a>
  <a href="/admin/events" class="{{if eq .Nav "events"}}active{{end}}">Events</a>
  <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}">Settings</a>
</nav>
{{end}}
{{end}}
