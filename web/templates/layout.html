{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
{{if .Concealed}}
<link rel="icon" type="image/svg+xml" href="/core/img/favicon.svg">
{{end}}
<link rel="stylesheet" href="/static/app.css">
{{end}}

{{define "topnav"}}
{{if .Concealed}}
<header class="topbar" style="background:#0082c9;border-bottom-color:#006ba3;">
  <a class="brand" href="/admin" style="display:flex;align-items:center;gap:8px;">
    <img src="/core/img/logo/logo.svg" alt="Nextcloud" style="height:20px;width:auto;">
  </a>
  <nav>
    <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}" style="color:#fff;">Dashboard</a>
    <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}" style="color:#fff;">Files</a>
    <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}" style="color:#fff;">Settings</a>
  </nav>
  <form method="post" action="/logout" class="logout-form">
    <button type="submit" class="btn btn-ghost" style="color:#fff;border-color:rgba(255,255,255,.4);">Log out</button>
  </form>
</header>
{{else}}
<header class="topbar">
  <a class="brand" href="/admin">🕸️ IPGrab</a>
  <nav>
    <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}">Dashboard</a>
    <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}">Links</a>
    <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}">Settings</a>
  </nav>
  <form method="post" action="/logout" class="logout-form">
    <button type="submit" class="btn btn-ghost">Log out</button>
  </form>
</header>
{{end}}
{{end}}
