{{define "head"}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
{{if .Concealed}}
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%230082c9'/%3E%3Ccircle cx='11' cy='19' r='5' fill='%23fff'/%3E%3Ccircle cx='21' cy='19' r='5' fill='%23fff'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23fff'/%3E%3C/svg%3E">
{{end}}
<link rel="stylesheet" href="/static/app.css">
{{end}}

{{define "topnav"}}
<header class="topbar">
  {{if .Concealed}}
  <a class="brand" href="/admin">☁️ Nextcloud</a>
  {{else}}
  <a class="brand" href="/admin">🕸️ IPGrab</a>
  {{end}}
  <nav>
    <a href="/admin" class="{{if eq .Nav "dashboard"}}active{{end}}">Dashboard</a>
    <a href="/admin/links" class="{{if eq .Nav "links"}}active{{end}}">{{if $.Concealed}}Files{{else}}Links{{end}}</a>
    <a href="/admin/settings" class="{{if eq .Nav "settings"}}active{{end}}">Settings</a>
  </nav>
  <form method="post" action="/logout" class="logout-form">
    <button type="submit" class="btn btn-ghost">Log out</button>
  </form>
</header>
{{end}}
