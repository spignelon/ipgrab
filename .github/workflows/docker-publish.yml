name: Publish Docker image

# Builds the same multi-stage Dockerfile already in this repo (no separate
# build definition to keep in sync) and pushes it to GHCR:
#   - push to main        -> ghcr.io/spignelon/netra:edge (+ :sha-xxxxxxx)
#   - push a v* tag        -> ghcr.io/spignelon/netra:latest and :vX.Y.Z, then
#                             notifies the staging server (via ntfy) to pull
#                             and redeploy - see the Wiki's GHCR Image
#                             Publishing / deploy pages for how that's wired.
# Runs entirely on GitHub-hosted runners; no external server/VPS involved in
# the build itself.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Doc-only commits shouldn't trigger a full multi-arch rebuild+publish.
    # GitHub doesn't evaluate paths-ignore for tag pushes, only branches, so
    # this only affects the :edge (main) trigger, not releases.
    paths-ignore:
      - "**.md"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for linux/arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.ref_name }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only on a release tag, and only after the image above has actually
      # finished pushing - the staging server's ntfy subscriber just does
      # `docker compose pull && up -d` on any message, so it must never fire
      # before the new image exists in the registry. Doesn't deploy on
      # :edge (main pushes) on purpose - see the comment at the top.
      - name: Notify deploy server via ntfy
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -sf -H "Authorization: Bearer ${{ secrets.NTFY_NETRA_DEPLOY_TOKEN }}" \
               -d "netra ${{ github.ref_name }} published, deploying" \
               "${{ secrets.NTFY_URL }}"
