services:
  netra:
    build: .
    image: netra:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: 8080
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      DATA_DIR: /data
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - netra_data:/data

volumes:
  netra_data:
