services:
  netra:
    build: .
    image: netra:latest
    restart: unless-stopped
    env_file: .env
    environment:
      # Enforced here (not just in .env) so `docker compose up` fails fast
      # with a clear message if it's missing, instead of silently falling
      # back to Netra's own ephemeral in-memory secret (which still starts,
      # just with a warning, and invalidates sessions on every restart).
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your .env file}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - netra_data:/data

volumes:
  netra_data:
